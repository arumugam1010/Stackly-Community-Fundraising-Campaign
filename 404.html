<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Charitics</title>

    <!-- libraries CSS -->
    <link rel="stylesheet" href="css/flaticon_charitics.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.min.css">

    <!-- custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            position: static !important;
            min-height: 100vh !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.82) 0%, rgba(30, 37, 47, 0.88) 100%), url('images/breadcrumb-bg.webp') center/cover no-repeat fixed !important;
            font-family: var(--font-primary, 'Manrope', sans-serif);
        }

        .ul-404-card {
            background: #ffffff;
            border-radius: 28px;
            padding: clamp(35px, 5vw, 55px) clamp(20px, 4vw, 45px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            max-width: 680px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .ul-404-img img {
            max-width: min(320px, 80vw);
            height: auto;
        }

        .ul-section-title {
            font-size: clamp(18px, 4vw, 30px);
            margin: 20px 0 16px;
            line-height: 1.35;
            padding: 0 10px;
            color: var(--ul-black);
            font-weight: 700;
        }

        .ul-404 .ul-btn {
            background-color: var(--ul-black) !important;
            border-color: var(--ul-black) !important;
            color: var(--white) !important;
            transition: all 0.3s ease !important;
        }

        .ul-404 .ul-btn i {
            background-color: var(--white) !important;
            color: var(--ul-black) !important;
            transition: all 0.3s ease !important;
        }

        .ul-404 .ul-btn:hover {
            background-color: transparent !important;
            border-color: var(--ul-black) !important;
            color: var(--ul-black) !important;
        }

        .ul-404 .ul-btn:hover i {
            background-color: var(--ul-primary) !important;
            color: var(--white) !important;
        }

        @media (max-width: 575px) {
            .ul-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="preloader" id="preloader">
        <div class="loader"></div>
    </div>

    <main class="d-flex align-items-center justify-content-center min-vh-100 py-5">
        <div class="container text-center">
            <section class="ul-404 text-center">
                <div class="ul-404-card">
                    <div class="ul-404-img">
                        <img src="images/404-img.webp" alt="404 Not Found" class="img-fluid">
                    </div>
                    <h2 class="ul-section-title">Oops! Something Went Wrong, Please Try Again Later</h2>
                    <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
                        <a href="index.html" class="ul-btn"><i class="flaticon-fast-forward-double-right-arrows-symbol"></i> Return to Home</a>
                        <a href="dashboard.html" id="btn-return-dashboard" class="ul-btn" style="display: none;"><i class="flaticon-fast-forward-double-right-arrows-symbol"></i> Return to Dashboard</a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- libraries JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/wow.min.js"></script>

    <!-- custom JS -->
    <script src="js/main.js"></script>
    <script>
        (function() {
            try {
                const auth = JSON.parse(localStorage.getItem('charitics_auth') || '{}');
                const btnDashboard = document.getElementById('btn-return-dashboard');
                if (auth && auth.isLoggedIn) {
                    if (btnDashboard) btnDashboard.style.display = 'inline-flex';
                } else {
                    if (btnDashboard) btnDashboard.style.display = 'none';
                }
            } catch (e) {
                console.error(e);
            }
        })();
    </script>
</body>

</html>
