<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Charitics - NGO & Non Profit</title>

    <!-- libraries CSS -->
    <link rel="stylesheet" href="css/flaticon_charitics.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/animate.min.css">

    <!-- custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --dash-sidebar-w: 260px;
            --dash-topbar-h: 70px;
            --dash-bg: #f4f6f9;
        }

        html {
            height: auto;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            background-color: var(--dash-bg);
            margin: 0;
            padding: 0;
            font-family: var(--font-manrope, sans-serif);
            color: #1e252f;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            width: 100%;
            min-height: 100vh;
            position: static !important;
        }

        /* Top Header */
        .dash-topbar {
            height: var(--dash-topbar-h);
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1020;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .dash-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dash-brand img {
            max-height: 42px;
        }

        .dash-hamburger {
            display: none;
            background: none;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
            color: #1e252f;
        }

        .dash-topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .role-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .role-badge.admin {
            background: rgba(235, 83, 16, 0.12);
            color: #EB5310;
        }

        .role-badge.donor {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
        }

        .role-badge.volunteer {
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
        }

        .dash-user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            padding: 6px 12px;
            border-radius: 30px;
            background: #f3f4f6;
        }

        .dash-user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #EB5310;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-top-action {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-home {
            background: #1e252f;
            color: #ffffff !important;
        }

        .btn-home:hover {
            background: #000;
        }

        .btn-logout {
            background: #fee2e2;
            color: #dc2626 !important;
            border: 1px solid #fecaca;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: #fca5a5;
        }

        /* Sidebar Layout */
        .dash-wrapper {
            display: flex;
            min-height: 100vh;
            padding-top: var(--dash-topbar-h);
            width: 100%;
            box-sizing: border-box;
        }

        .dash-sidebar {
            width: var(--dash-sidebar-w);
            background: #ffffff;
            border-right: 1px solid rgba(0, 0, 0, 0.08);
            position: fixed;
            top: var(--dash-topbar-h);
            bottom: 0;
            left: 0;
            z-index: 1010;
            display: flex;
            flex-direction: column;
            padding: 16px 10px;
            transition: transform 0.3s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        .dash-sidebar-header {
            flex-shrink: 0;
        }

        .dash-sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            font-weight: 700;
            padding: 6px 14px 10px;
        }

        .dash-sidebar-nav {
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 0;
            padding-right: 2px;
        }

        .dash-sidebar-nav::-webkit-scrollbar {
            width: 4px;
        }

        .dash-sidebar-nav::-webkit-scrollbar-track {
            background: transparent;
        }

        .dash-sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 4px;
        }

        .dash-sidebar-footer {
            flex-shrink: 0;
            padding-top: 12px;
            margin-top: 8px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .dash-sidebar-logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #dc2626;
            background: #fee2e2;
            border: 1px solid #fecaca;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            box-sizing: border-box;
            font-family: inherit;
        }

        .dash-sidebar-logout-btn:hover {
            background: #fca5a5;
            color: #991b1b;
            border-color: #f87171;
            transform: translateX(2px);
        }

        .dash-sidebar-logout-btn svg {
            flex-shrink: 0;
        }

        .dash-nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .dash-nav-item {
            margin-bottom: 3px;
        }

        .dash-nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }

        .dash-nav-link i {
            font-size: 18px;
            width: 24px;
            text-align: center;
            color: #6b7280;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dash-nav-link:hover {
            background: rgba(235, 83, 16, 0.08);
            color: var(--ul-primary, #EB5310);
        }

        .dash-nav-link:hover i {
            color: var(--ul-primary, #EB5310);
        }

        .dash-nav-link.active {
            background: var(--ul-primary, #EB5310) !important;
            color: #ffffff !important;
        }

        .dash-nav-link.active i {
            color: #ffffff !important;
        }

        .dash-nav-badge {
            margin-left: auto;
            font-size: 11px;
            background: rgba(0, 0, 0, 0.08);
            padding: 2px 7px;
            border-radius: 10px;
        }

        .dash-nav-link.active .dash-nav-badge {
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        /* Main Content */
        .dash-main {
            margin-left: var(--dash-sidebar-w);
            flex: 1;
            padding: 26px clamp(18px, 2.5vw, 36px);
            width: calc(100% - var(--dash-sidebar-w));
            max-width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        /* Equal height & aligned cards across all dashboard grid rows */
        .dash-main .row {
            align-items: stretch;
        }

        .dash-main .row > [class*="col-"] {
            display: flex;
            flex-direction: column;
        }

        .dash-main .row > [class*="col-"] > .border,
        .dash-main .row > [class*="col-"] > .bg-light,
        .dash-main .row > [class*="col-"] > .stat-card {
            height: 100%;
            width: 100%;
            flex: 1 1 auto;
            box-sizing: border-box;
        }

        /* Metric Cards */
        .stat-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            gap: 16px;
            height: 100%;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-icon-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .stat-icon-orange {
            background: rgba(235, 83, 16, 0.12);
            color: #EB5310;
        }

        .stat-icon-green {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
        }

        .stat-icon-blue {
            background: rgba(59, 130, 246, 0.12);
            color: #3b82f6;
        }

        .stat-icon-purple {
            background: rgba(139, 92, 246, 0.12);
            color: #8b5cf6;
        }

        .stat-title {
            font-size: 13px;
            color: #6b7280;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 800;
            color: #1e252f;
            margin: 0;
        }

        .stat-meta {
            font-size: 12px;
            color: #10b981;
            font-weight: 600;
        }

        /* Section Cards */
        .dash-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .dash-card-header {
            padding: 18px 22px;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dash-card-title {
            font-size: 16px;
            font-weight: 700;
            color: #1e252f;
            margin: 0;
        }

        .dash-card-body {
            padding: 22px;
        }

        /* Buttons inside dashboard */
        .btn-dash-action {
            padding: 7px 14px;
            background: var(--ul-primary, #EB5310);
            color: #fff !important;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-dash-action:hover {
            background: #d64708;
        }

        .btn-dash-secondary {
            background: #f3f4f6;
            color: #374151 !important;
            border: 1px solid #e5e7eb;
        }

        .btn-dash-secondary:hover {
            background: #e5e7eb;
        }

        /* Table */
        .dash-table {
            width: 100%;
            margin: 0;
            font-size: 13px;
        }

        .dash-table th {
            font-weight: 700;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px;
            background: #f9fafb;
        }

        .dash-table td {
            padding: 13px 12px;
            vertical-align: middle;
            border-bottom: 1px solid #f3f4f6;
        }

        /* Prevent background scroll when sidebar is open */
        html.dash-no-scroll,
        body.dash-no-scroll {
            overflow: hidden !important;
            height: 100vh !important;
            touch-action: none !important;
        }

        /* Backdrop overlay for mobile */
        .dash-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1005;
            touch-action: none;
        }

        /* Mobile View Rules */
        @media screen and (max-width: 991px) {
            .dash-hamburger {
                display: block;
            }

            .dash-sidebar {
                transform: translateX(-100%);
                width: 280px;
                max-width: 85vw;
                box-shadow: 4px 0 25px rgba(0, 0, 0, 0.15);
            }

            .dash-sidebar.open {
                transform: translateX(0);
            }

            .dash-backdrop.active {
                display: block;
            }

            .dash-main {
                margin-left: 0 !important;
                width: 100% !important;
                padding: 18px 12px 60px !important;
            }

            .btn-top-action.btn-home span,
            .btn-top-action.btn-logout span {
                display: none;
            }

            .dash-user-chip span.name {
                display: none;
            }
        }

        @media screen and (max-width: 575px) {
            .dash-topbar {
                padding: 0 10px;
                height: 60px;
            }

            :root {
                --dash-topbar-h: 60px;
            }

            .dash-brand img {
                max-height: 32px;
            }

            .dash-hamburger {
                padding: 6px 10px;
                font-size: 16px;
            }

            .role-badge #role-text {
                display: none;
            }

            .role-badge {
                padding: 5px 8px;
            }

            .dash-user-chip {
                padding: 4px;
            }

            .btn-top-action {
                padding: 6px 10px;
                font-size: 12px;
            }

            .dash-topbar-actions {
                gap: 6px;
            }

            .dash-card-header {
                padding: 14px 14px;
            }

            .dash-card-body {
                padding: 14px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-val {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Mobile Backdrop -->
    <div class="dash-backdrop" id="dash-backdrop"></div>

    <!-- Top Navigation Bar -->
    <header class="dash-topbar">
        <div class="dash-brand">
            <button class="dash-hamburger" id="dash-hamburger-btn" aria-label="Toggle Navigation">
                <i class="flaticon-menu"></i>
            </button>
            <a href="javascript:void(0)" onclick="selectSidebarItem(event, 1)" class="d-inline-flex align-items-center" id="dash-brand-logo" title="Dashboard">
                <img src="images/logo-stackly-orange.webp" alt="Stackly Logo">
            </a>
        </div>

        <div class="dash-topbar-actions">
            <!-- Active Role Badge -->
            <span class="role-badge donor" id="active-role-badge">
                <i class="flaticon-costumer"></i> <span id="role-text">Donor</span>
            </span>

            <!-- User Chip -->
            <div class="dash-user-chip">
                <div class="dash-user-avatar" id="user-avatar">D</div>
                <span class="name" id="user-display-name">Donor</span>
            </div>

        </div>
    </header>

    <div class="dash-wrapper">
        <!-- Sidebar Navigation (Dedicated 10 Items per Role) -->
        <aside class="dash-sidebar" id="dash-sidebar">
            <div class="dash-sidebar-header d-flex justify-content-between align-items-center mb-1 pe-2">
                <div class="dash-sidebar-title" id="dash-sidebar-title">Donor Portal</div>
                <button type="button" class="btn btn-sm btn-light d-lg-none" onclick="closeMobileSidebar()" aria-label="Close sidebar" style="border-radius: 8px; font-size: 14px; padding: 2px 8px; border: 1px solid #e5e7eb;">
                    <i class="flaticon-close"></i>
                </button>
            </div>
            <div class="dash-sidebar-nav">
                <ul class="dash-nav-list" id="dash-nav-list">
                    <!-- Dynamically populated per role with 10 dedicated items -->
                </ul>
            </div>
            <div class="dash-sidebar-footer">
                <button type="button" class="dash-sidebar-logout-btn" id="btn-dash-logout" title="Sign Out">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Dashboard Workspace -->
        <main class="dash-main" id="dash-main-container">
            <!-- Rendered dynamically for each of the 10 sidebar items -->
        </main>
    </div>

    <!-- Libraries JS -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="js/dashboard-views.js"></script>
</body>

</html>
